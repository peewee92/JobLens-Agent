[project]
name = "joblens-backend"
version = "0.1.0"
description = "JobLens Agent Backend - Modular Monolith baseline (Step 1)"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2,<3",
    "alembic",
    "httpx>=0.28,<1",
    "pypdf>=6,<7",
    "python-multipart>=0.0.20,<1",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
