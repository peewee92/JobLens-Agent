<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>岗位筛选运行中 v1.4.1</title>
  <link rel="stylesheet" href="runner.css">
</head>
<body>
  <main>
    <h1>岗位筛选 <small>v1.4.1</small></h1>
    <p id="summary">准备中…</p>
    <progress id="progress" value="0" max="1"></progress>
    <pre id="log"></pre>
    <div class="actions">
      <button id="stop">停止</button>
      <button id="csv" disabled>下载 CSV</button>
      <button id="json" disabled>下载完整报告</button>
      <button id="diagnostics" disabled>下载诊断 JSON</button>
      <button id="requirementReview" disabled>下载 Requirement 验收数据</button>
    </div>
    <p class="hint">插件不会绕过验证码。详情补采会增加访问次数；遇到安全验证时请在 BOSS 标签页人工完成。</p>
  </main>
  <script src="lib.js"></script>
  <script src="runner.js"></script>
</body>
</html>
